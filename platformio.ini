; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ──────────────────────────────────────────────
;  j4_controller_v0_6_4 / TTGO T-Display v1.1
;  simple, local-library setup (Option A)
; ──────────────────────────────────────────────
[env:ttgo-t-display]
platform    = espressif32
board       = ttgo-t1
framework   = arduino

monitor_speed = 115200
upload_speed  = 921600

; local TFT_eSPI stays in lib/ (no entry needed here)
; our local copy of TFT_eSPI is still used automatically

lib_deps =
  RobTillaart/PCF8574@0.3.9
  RobTillaart/I2CKeyPad@0.3.3
  RobTillaart/ADS1X15@0.3.13
